name: Windows EXE
on:
  push:
    branches: [build/oyun-ekrani-cevirmen]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/ekran-cevirmen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Install OCR engine
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $ocr = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $ocr 'tesseract.exe'))) { throw 'Tesseract binary missing' }
          if (-not (Test-Path (Join-Path $ocr 'tessdata/eng.traineddata'))) { throw 'English OCR data missing' }
          & (Join-Path $ocr 'tesseract.exe') --version
      - name: Build self-contained executable
        shell: pwsh
        run: |
          $ocr = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Oyun_Ekrani_Cevirmen --add-binary "${ocr};tesseract" ekran_cevirmen.py
          if (-not (Test-Path 'dist/Oyun_Ekrani_Cevirmen.exe')) { throw 'EXE missing' }
      - name: Test bundled OCR
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/Oyun_Ekrani_Cevirmen.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Bundled OCR self-test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Oyun_Ekrani_Cevirmen_Windows
          path: tools/ekran-cevirmen/dist/Oyun_Ekrani_Cevirmen.exe
